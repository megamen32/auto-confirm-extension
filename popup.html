<!DOCTYPE html>
<html style="width:320px;padding:12px;font-family:system-ui"><head><meta charset="UTF-8"><style>
body{margin:0;font-size:14px}.toggle{display:flex;align-items:center;gap:10px;padding:8px 0}.hint{margin:4px 0 8px 50px;color:#666;font-size:12px;line-height:1.3}
.switch{position:relative;width:40px;height:22px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:22px;transition:.3s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;bottom:2px;background:white;border-radius:50%;transition:.3s}
input:checked+.slider{background:#10a37f}input:checked+.slider:before{transform:translateX(18px)}
</style></head><body>
<div class="toggle"><label class="switch"><input type="checkbox" id="toggleAutoConfirm"><span class="slider"></span></label><span>Auto-confirm enabled</span></div>
<div class="toggle"><label class="switch"><input type="checkbox" id="toggleBackgroundClicks"><span class="slider"></span></label><span>Background clicks via debugger</span></div>
<div class="hint">Opt-in. Uses Chrome debugger/CDP input; Chrome may show a debugger warning.</div>
<div class="toggle"><label class="switch"><input type="checkbox" id="toggleTabTitleChanges"><span class="slider"></span></label><span>Countdown in tab title</span></div>
<div class="hint">Opt-in. Temporarily changes the page title during countdown/click.</div>
<div class="toggle"><label class="switch"><input type="checkbox" id="toggleExpandToolCalls"><span class="slider"></span></label><span>Auto expand tool calls</span></div>
<div class="toggle"><label class="switch"><input type="checkbox" id="toggleExpandInputs"><span class="slider"></span></label><span>Auto expand inputs</span></div>
<div class="toggle"><label class="switch"><input type="checkbox" id="toggleExpandOutputs"><span class="slider"></span></label><span>Auto expand outputs</span></div>
<script src="popup.js"></script></body></html>
